  <text x="244" y="195" font-family="Inter, sans-serif" font-size="9" fill="#005c3a">▲ +12% ce mois</text>

  <rect x="374" y="134" width="130" height="70" rx="10" fill="#FAFAF7" stroke="#D8E1DD" stroke-width="1"/>
