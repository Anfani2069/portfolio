  <rect x="60" y="70" width="680" height="12" fill="#002F34"/>
  <circle cx="88" cy="61" r="6" fill="#ff6058"/>
  <circle cx="108" cy="61" r="6" fill="#ffbd2e"/>
  <circle cx="128" cy="61" r="6" fill="#27c93f"/>
  <rect x="200" y="51" width="300" height="20" rx="6" fill="rgba(255,255,255,0.12)"/>

