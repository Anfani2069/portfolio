  <rect x="527" y="283" width="44" height="15" rx="8" fill="rgba(158,247,168,0.2)"/>
  <text x="549" y="294" font-family="Inter, sans-serif" font-size="9" fill="#005c3a" text-anchor="middle" font-weight="600">Succès</text>
  <text x="650" y="292" font-family="Inter, sans-serif" font-size="10" fill="#002F34" font-weight="600">+2 410</text>

  <line x1="232" y1="304" x2="730" y2="304" stroke="#D8E1DD" stroke-width="0.5"/>
  <text x="248" y="318" font-family="Inter, sans-serif" font-size="10" fill="#002F34">Collecte #1041</text>
  <text x="400" y="318" font-family="Inter, sans-serif" font-size="10" fill="#536666">22 juil. 2026</text>
  <rect x="527" y="309" width="44" height="15" rx="8" fill="rgba(158,247,168,0.2)"/>
  <text x="549" y="320" font-family="Inter, sans-serif" font-size="9" fill="#005c3a" text-anchor="middle" font-weight="600">Succès</text>
  <text x="650" y="318" font-family="Inter, sans-serif" font-size="10" fill="#002F34" font-weight="600">+1 890</text>

  <line x1="232" y1="330" x2="730" y2="330" stroke="#D8E1DD" stroke-width="0.5"/>
  <text x="248" y="344" font-family="Inter, sans-serif" font-size="10" fill="#002F34">Collecte #1040</text>
  <text x="400" y="344" font-family="Inter, sans-serif" font-size="10" fill="#536666">21 juil. 2026</text>
  <rect x="527" y="335" width="52" height="15" rx="8" fill="rgba(255,180,0,0.12)"/>
  <text x="553" y="346" font-family="Inter, sans-serif" font-size="9" fill="#996600" text-anchor="middle" font-weight="600">En cours</text>
  <text x="650" y="344" font-family="Inter, sans-serif" font-size="10" fill="#536666">—</text>

  <!-- Bottom label -->
  <rect x="60" y="450" width="680" height="38" rx="8" fill="rgba(0,47,52,0.04)" stroke="#D8E1DD" stroke-width="1"/>
  <text x="400" y="474" font-family="Inter, sans-serif" font-size="11" fill="#536666" text-anchor="middle" font-weight="500">saascollect.fr — Développé &amp; déployé en production</text>
