  <rect x="84" y="221" width="12" height="12" rx="3" fill="rgba(255,255,255,0.3)"/>
  <text x="102" y="232" font-family="Inter, sans-serif" font-size="11" fill="rgba(255,255,255,0.6)">Analytics</text>
